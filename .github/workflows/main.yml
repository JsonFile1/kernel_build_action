name: Build Kernel Onyx
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: u-p-p-e-r/kernel_build_action@main
        with:
          kernel-url: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
          kernel-branch: onyx-v-oss
          config: onyx_user_defconfig
          arch: arm64
          android-version: 15
          # Твоя проверенная версия компилятора
          aosp-clang-version: r510928
          # Отключаем GCC, так как экшен умеет собирать LLVM-only
          aosp-gcc: false
          # Включаем всё, что ты просил
          ksu: true
          ksu-version: main
          nethunter: true
          anykernel3: true
