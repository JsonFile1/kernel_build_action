name: CI

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel for Onyx
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Kernel
      uses: dabao1955/kernel_build_action@main
      with:
          kernel-url: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
          # Твоя ветка для Poco F7
          kernel-branch: onyx-v-oss
          config: onyx_user_defconfig
          arch: arm64
          # GCC необходим как вспомогательный инструмент
          aosp-gcc: true
          aosp-clang: true
          # Включаем Root и NetHunter (HID/BadUSB)
          ksu: true
          ksu-version: main
          nethunter: true
          android-version: 15
          # Используем проверенную версию Clang из твоего примера
          aosp-clang-version: r510928
          disable-lto: true
          anykernel3: true
