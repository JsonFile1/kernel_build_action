name: Build Kernel (Onyx GKI)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison binfmt-support libssl-dev libelf-dev libncurses-dev git-lfs aarch64-linux-gnu-gcc

      - name: Download Clang (r510928)
        run: |
          # Клонируем именно ту ветку и коммит, которые ты указал
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b main clang-repo
          mkdir -p clang
          # Перемещаем содержимое нужной папки r510928
          cp -r clang-repo/clang-r510928/* clang/
          rm -rf clang-repo

      - name: Clone Kernel
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b onyx-v-oss kernel
          
      - name: Setup KernelSU Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          cd kernel
          # Сборка с использованием скачанного Clang
          make ARCH=arm64 O=out onyx_user_defconfig
          make ARCH=arm64 O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-Onyx-KSU
          path: kernel/out/arch/arm64/boot/Image
