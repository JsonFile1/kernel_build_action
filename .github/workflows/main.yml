name: Build Kernel (Onyx)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: Tst-repo/tst-kernel-builder@main
        with:
          # Официальные исходники
          kernel-url: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
          kernel-branch: onyx-v-oss
          config: onyx_user_defconfig
          arch: arm64
          
          # Указываем версию Clang напрямую (твоя проверенная r510928)
          clang-version: r510928
          
          # Включаем KernelSU и NetHunter
          kernelsu: true
          ksu-version: main
          nethunter: true
          
          # Оптимизации
          lto: false
          
          # На выходе получаем готовый AnyKernel3
          anykernel3: true
