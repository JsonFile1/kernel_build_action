name: CI

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel for Onyx
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Kernel
      uses: dabao1955/kernel_build_action@main
      with:
          # Официальный репозиторий Xiaomi
          kernel-url: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
          # Ветка для Poco F7 (Onyx) под Android 15/16
          kernel-branch: onyx-v-oss
          # Конфиг устройства
          config: onyx_user_defconfig
          arch: arm64
          # Включаем GCC (требуется экшеном для работы Clang)
          aosp-gcc: true
          aosp-clang: true
          # Включаем Root и инструменты взлома
          ksu: true
          ksu-version: main
          nethunter: true
          # Настройки под актуальное железо
          android-version: 15
          aosp-clang-version: r522815
          # Отключаем тяжелые оптимизации для первой сборки
          disable-lto: true
          anykernel3: true
